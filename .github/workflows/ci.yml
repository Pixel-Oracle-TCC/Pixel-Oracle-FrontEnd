name: CI

run-name: ${{ github.event_name == 'pull_request' && format('Validação do frontend no pull request #{0}', github.event.pull_request.number) || format('Validação do frontend em {0}', github.ref_name) }}

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        id: unit
        run: |
          set -o pipefail
          npm test -- --watch=false 2>&1 | tee "$RUNNER_TEMP/front-test.log"

      - name: Testa o texto do comentário
        if: always()
        run: node --test .github/scripts/pull-request-comment.test.mjs

      - name: Publica o quadro
        if: always()
        env:
          CI_LOG: ${{ runner.temp }}/front-test.log
          CI_FORMAT: vitest
          CI_CHECK: test
          CI_MARKER: pixel-oracle-ci:frontend
          CI_CONTRACT_LABEL: mapFormToGamePitch
          CI_TITLE: Validação do frontend
          GITHUB_TOKEN: ${{ github.token }}
          CI_ROWS: |
            Testes unitários|${{ steps.unit.outcome }}|tests
        run: node .github/scripts/pull-request-comment.mjs

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Publica o quadro
        if: always()
        env:
          CI_TITLE: Build de produção
          CI_ROWS: |
            Build de produção|${{ steps.build.outcome }}|o build de produção fecha
        run: node .github/scripts/pull-request-comment.mjs

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit
        id: audit
        run: npm audit --audit-level=critical

      - name: Publica o quadro
        if: always()
        env:
          CI_TITLE: Audit
          CI_ROWS: |
            Audit crítico|${{ steps.audit.outcome }}|sem vulnerabilidade crítica
        run: node .github/scripts/pull-request-comment.mjs

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        id: gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose

      - name: Publica o quadro
        if: always()
        env:
          CI_TITLE: Validação de segredos
          CI_ROWS: |
            Gitleaks|${{ steps.gitleaks.outcome }}|nenhuma chave nova no histórico
        run: node .github/scripts/pull-request-comment.mjs

  relatorio:
    name: relatório
    if: always()
    needs: [test, build, audit, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Quadro do pipeline
        env:
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          AUDIT: ${{ needs.audit.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          label() {
            case "$1" in
              success) echo "passou" ;;
              failure) echo "falhou" ;;
              skipped) echo "não rodou" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## Pipeline"
            echo ""
            echo "| Check | Resultado |"
            echo "|-------|-----------|"
            echo "| \`test\` | $(label "$TEST") |"
            echo "| \`build\` | $(label "$BUILD") |"
            echo "| \`audit\` | $(label "$AUDIT") |"
            echo "| \`secrets\` | $(label "$SECRETS") |"
          } >> "$GITHUB_STEP_SUMMARY"
