name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: |
          set -o pipefail
          npm test -- --watch=false 2>&1 | tee "$RUNNER_TEMP/front-test.log"

      - name: Resumo da validação
        if: always()
        run: |
          {
            echo "## Validação do frontend"
            echo ""
            echo "Testes unitários do app, do formulário de pitch e dos formatadores do dashboard."
            echo ""
            echo '```'
            tail -n 40 "$RUNNER_TEMP/front-test.log" 2>/dev/null || echo "O log de testes não foi gerado."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Testa o texto do comentário
        if: always()
        run: node --test .github/scripts/pull-request-comment.test.mjs

      - name: Comenta o pull request
        if: always() && github.event_name == 'pull_request'
        env:
          CI_LOG: ${{ runner.temp }}/front-test.log
          CI_FORMAT: vitest
          CI_CHECK: test
          CI_MARKER: pixel-oracle-ci:frontend
          CI_CONTRACT_LABEL: mapFormToGamePitch
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pull-request-comment.mjs

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=critical

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose
